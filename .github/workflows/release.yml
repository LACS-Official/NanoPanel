name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 v0.1.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: echo "value=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build all architectures
        run: make build-all VERSION=${{ steps.ver.outputs.value }}

      - name: Create release bundles
        run: |
          for a in amd64 arm64 armv7; do
            tar -czf "nanopanel-${{ steps.ver.outputs.value }}-linux-${a}.tar.gz" \
              -C deploy "nanopanel-${a}" "nanopanel-${a}.sha256" \
              install.sh uninstall.sh npctl nanopanel.service apps
            # 稳定文件名：install.sh 用 /releases/latest/download/ 时无需知道版本号
            cp "nanopanel-${{ steps.ver.outputs.value }}-linux-${a}.tar.gz" \
              "nanopanel-linux-${a}.tar.gz"
          done
          cp deploy/install.sh install.sh
          cp deploy/uninstall.sh uninstall.sh
          cp deploy/npctl npctl

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NanoPanel ${{ steps.ver.outputs.value }}
          generate_release_notes: true
          body: |
            ## 一键安装

            ```bash
            curl -fsSL https://npanel.lacs.cc/install.sh | sudo bash
            ```

            国内网络会自动测速切换镜像，也可指定：

            ```bash
            export GITHUB_MIRROR=https://ghfast.top/https://github.com
            curl -fsSL https://npanel.lacs.cc/install.sh | sudo bash
            ```

            官网 <https://npanel.lacs.cc> · 文档 <https://npanel.lacs.cc/docs>

            > 发布说明由 GitHub 自动生成，见下方。
          files: |
            deploy/nanopanel-amd64
            deploy/nanopanel-amd64.sha256
            deploy/nanopanel-arm64
            deploy/nanopanel-arm64.sha256
            deploy/nanopanel-armv7
            deploy/nanopanel-armv7.sha256
            nanopanel-*.tar.gz
            install.sh
            uninstall.sh
            npctl

      # 兼容桥接：v0.2.2 及更早版本的面板把去掉 v 的版本号直接拼进下载路径，
      # 会请求 /releases/download/0.2.3/... 而得到 404（真实 tag 为 v0.2.3）。
      # 这些旧二进制无法通过发布新版本自愈，故额外发布一份去 v 前缀的
      # prerelease 资产副本，让旧版「立即升级」也能拿到修复版。
      # 标记 prerelease 可确保 /releases/latest 仍指向上面的正式 Release。
      - name: Resolve legacy-compatible tag
        id: compat
        env:
          VALUE: ${{ steps.ver.outputs.value }}
        run: echo "tag=${VALUE#v}" >> "$GITHUB_OUTPUT"

      - name: Publish legacy-compatible release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compat.outputs.tag }}
          name: "兼容镜像 ${{ steps.compat.outputs.tag }}（旧版面板升级用）"
          prerelease: true
          body: |
            仅供 v0.2.2 及更早版本面板的站内自动升级使用。

            这些版本的下载路径缺少 `v` 前缀，会请求 `/releases/download/${{ steps.compat.outputs.tag }}/...`；
            本 Release 提供与正式版 `v${{ steps.compat.outputs.tag }}` 完全相同的资产副本，
            使旧版可一键升级到修复版。普通用户请使用带 `v` 前缀的正式 Release。
          files: |
            deploy/nanopanel-amd64
            deploy/nanopanel-amd64.sha256
            deploy/nanopanel-arm64
            deploy/nanopanel-arm64.sha256
            deploy/nanopanel-armv7
            deploy/nanopanel-armv7.sha256
            nanopanel-*.tar.gz
            install.sh
            uninstall.sh
            npctl

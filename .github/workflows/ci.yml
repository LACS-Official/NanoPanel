name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build / vet / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        env:
          RACE: ${{ runner.os == 'Linux' && '-race' || '' }}
        run: |
          set -o pipefail
          go test $RACE -cover ./... 2>&1 | tee test.log || {
            {
              echo "### ❌ 测试失败（${{ matrix.os }}）"
              echo '```text'
              tail -100 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: gofmt check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Frontend JS syntax check
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          test -z "$(grep -n $'\r' web/app.js web/index.html web/style.css)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  cross-build:
    name: Cross build (linux/${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: amd64, goarch: amd64}
          - {name: arm64, goarch: arm64}
          - {name: armv7, goarch: arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: go build -trimpath -o nanopanel-${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: nanopanel-${{ matrix.name }}
          path: nanopanel-${{ matrix.name }}
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build / vet / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        env:
          RACE: ${{ runner.os == 'Linux' && '-race' || '' }}
        run: |
          set -o pipefail
          if go test $RACE -cover ./... 2>&1 | tee test.log; then
            exit 0
          fi
          # 失败的测试名以 annotation 形式暴露到运行页，无需登录即可定位
          grep -aE '^(--- FAIL|panic:|FAIL[[:space:]])' test.log | head -30 | while IFS= read -r line; do
            echo "::error title=test-failed::$line"
          done
          {
            echo "### ❌ 测试失败（${{ matrix.os }}）"
            echo '```text'
            tail -120 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: gofmt check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Frontend JS syntax check
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          node --check web/chart.js
          node --check web/term-core.js
          node --check web/terminal.js
          test -z "$(grep -n $'\r' web/app.js web/chart.js web/term-core.js web/terminal.js web/index.html web/style.css)"
      - name: Terminal frontend tests
        if: runner.os == 'Linux'
        run: |
          node tests/frontend/term-core.test.js
          node tests/frontend/terminal-ui.test.js
          node tests/frontend/chart.test.js
          node tests/frontend/process-ui.test.js
      - name: CSP inline-action guard
        if: runner.os == 'Linux'
        run: |
          # CSP 使用 script-src 'self'，禁止 HTML 内联事件处理器（会让按钮点击无反应）。
          if grep -nE 'on(click|keydown|change)="[^"]*"' web/index.html; then
            echo "::error::检测到内联事件处理器，请改用 data-act 声明并在 app.js 中注册映射"
            exit 1
          fi
          # 每个声明动作都必须在 INLINE_ACTIONS 白名单中有对应处理函数。
          grep -oE 'data-(act|keydown|change)="[^"]*"' web/index.html \
            | sed -E 's/^[^"]*"//; s/"$//' | sort -u | while IFS= read -r act; do
            grep -Fq "\"$act\":" web/app.js || {
              echo "::error::缺少页面动作映射: $act"
              exit 1
            }
          done
          echo "内联事件检查通过"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        env:
          # CI 不依赖外网稳定性，使用兜底版本；官网实际部署由 Vercel 负责
          NP_RELEASE_SOURCE: static
        run: npm run build
      - name: Verify install script synced
        run: |
          diff -q deploy/install.sh website/dist/install.sh \
            || { echo "::error title=install-script-drift::dist/install.sh 与 deploy/install.sh 不一致"; exit 1; }
          test -f website/dist/sitemap.xml

  install-script:
    name: install.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          bash -n deploy/install.sh
          bash -n deploy/uninstall.sh
          bash deploy/install.sh --help > /dev/null
          echo "::notice title=install.sh::语法检查通过"
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning deploy/*.sh deploy/npctl
          echo "::notice title=shellcheck::部署脚本静态检查通过"

  cross-build:
    name: Cross build (linux/${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: amd64, goarch: amd64}
          - {name: arm64, goarch: arm64}
          - {name: armv7, goarch: arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: go build -trimpath -o nanopanel-${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: nanopanel-${{ matrix.name }}
          path: nanopanel-${{ matrix.name }}
          if-no-files-found: error

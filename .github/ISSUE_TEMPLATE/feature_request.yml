name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述实际使用场景，而不只是想要的功能名
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该方案不需要引入第三方 Go 依赖
          required: false
        - label: 该方案在 512MB 内存的设备上仍可运行
          required: false
